<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>Queue Diagnostic</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  font-size: 18px;
}

.item {
  background: #f3f3f3;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 12px;
}

.item strong {
  font-size: 20px;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 14px;
  margin-bottom: 0;
}

button {
  font-size: 18px;
  padding: 10px 16px;
}
</style>
</head>

<body>

<h2>Fowler Kiosk Queue Diagnostic</h2>

<h3 id="summary"></h3>

<div id="items"></div>

<button onclick="refresh()">Refresh</button>

<script>
function refresh() {
  let queue = [];

  try {
    queue = JSON.parse(
      localStorage.getItem("offlineQueue") || "[]"
    );
  } catch(e) {
    document.getElementById("summary").innerText =
      "ERROR reading queue: " + e.message;
    return;
  }

  document.getElementById("summary").innerText =
    "Pending items: " + queue.length;

  const container = document.getElementById("items");
  container.innerHTML = "";

  queue.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML =
      "<strong>Queue item " + (index + 1) + "</strong>" +
      "<pre>" +
      escapeHtml(JSON.stringify(item, null, 2)) +
      "</pre>";

    container.appendChild(div);
  });
}

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

refresh();
</script>

</body>
</html>
